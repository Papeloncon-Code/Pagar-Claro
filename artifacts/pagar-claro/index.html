<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagar Claro</title>
    <meta name="description" content="Compara el precio en dólares con el precio en bolívares de la etiqueta." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Pagar Claro" />
    <meta property="og:description" content="Compara el precio en dólares con el precio en bolívares de la etiqueta." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pagar Claro" />
    <meta name="twitter:description" content="Compara el precio en dólares con el precio en bolívares de la etiqueta." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="m6.5 12.3 3.6 3.5 7.6-7.7" stroke="white" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">Pagar Claro</span>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Compra con claridad</p>
        <h1 id="page-title">Compara el precio antes de pagar</h1>
        <p class="intro-copy">Revisa el precio en dólares frente al monto en bolívares que aparece en la etiqueta.</p>
      </section>

      <form class="price-form" aria-label="Comparar precios">
        <div class="field">
          <label for="price-usd">Precio en $</label>
          <div class="input-wrap">
            <span class="currency" aria-hidden="true">$</span>
            <input id="price-usd" name="price-usd" type="text" inputmode="decimal" autocomplete="off" aria-label="Precio en dólares" />
          </div>
        </div>

        <div class="field">
          <label for="price-ves">Precio en Bs de la etiqueta</label>
          <div class="input-wrap">
            <span class="currency" aria-hidden="true">Bs</span>
            <input id="price-ves" name="price-ves" type="text" inputmode="decimal" autocomplete="off" aria-label="Precio en bolívares de la etiqueta" />
          </div>
        </div>

        <button class="calculate" type="button">Calcular</button>
      </form>

      <section class="result-card" aria-label="Resultado de la comparación">
        <span class="result-symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 7.5h14M5 16.5h14M8 5v5m8 4v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="8" cy="12" r="2" fill="currentColor"/>
            <circle cx="16" cy="12" r="2" fill="currentColor"/>
          </svg>
        </span>
        <div>
          <p class="result-title">Aquí aparecerá la comparación</p>
          <p class="result-hint">Ingresa los dos precios para revisar la diferencia.</p>
        </div>
      </section>

      <footer class="rates" aria-label="Tasas diarias">
        <p class="rates-heading">Tasas de hoy</p>
        <div class="rate-grid">
          <div class="rate">
            <span class="rate-name">BCV</span>
            <span class="rate-value" aria-label="Sin valor disponible"></span>
          </div>
          <div class="rate">
            <span class="rate-name">Euro BCV</span>
            <span class="rate-value" aria-label="Sin valor disponible"></span>
          </div>
          <div class="rate">
            <span class="rate-name">Paralelo</span>
            <span class="rate-value" aria-label="Sin valor disponible"></span>
          </div>
        </div>
      </footer>
    </main>
  </body>
</html>
